[build]
  base    = "personal-portfolio-website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Watch the entire repo for changes, not just the base directory
# This ensures CMS content edits (in src/content/) trigger a rebuild
[context.production]
  ignore = ""

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
