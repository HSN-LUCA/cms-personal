[build]
  base    = "personal-portfolio-website"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NODE_OPTIONS = "--max-old-space-size=4096"

# Tell Netlify to rebuild when ANY file in the repo changes
# (not just files inside the base directory)
[build.processing]
  skip_processing = false

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
