backend:
  name: github
  repo: HSN-LUCA/cms-personal
  branch: main

# Where uploaded images get stored (served from public/)
media_folder: public/images
public_folder: /images

# Allow editorial workflow (draft → review → publish)
publish_mode: editorial_workflow

collections:

  # ─── Profile ────────────────────────────────────────────────────────────────
  - name: profile
    label: Profile
    files:
      - name: profile
        label: Personal Info
        file: src/content/profile.json
        format: json
        fields:
          - { label: Full Name, name: name, widget: string }
          - { label: Professional Title, name: title, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Bio, name: bio, widget: text, hint: "Use two line breaks for paragraph separation" }
          - { label: Profile Photo, name: photo, widget: image }
          - { label: Resume URL, name: resumeUrl, widget: string, default: /resume.pdf }
          - { label: Email, name: email, widget: string }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: LinkedIn URL, name: linkedin, widget: string }
              - { label: GitHub URL, name: github, widget: string }
              - { label: "WhatsApp (phone number, optional)", name: whatsapp, widget: string, required: false }

  # ─── Skills ─────────────────────────────────────────────────────────────────
  - name: skills
    label: Skills
    files:
      - name: skills
        label: Skills
        file: src/content/skills.json
        format: json
        fields:
          - label: Skill Categories
            name: root
            widget: list
            fields:
              - { label: Category Name, name: category, widget: string }
              - label: Skills
                name: items
                widget: list
                fields:
                  - { label: Skill Name, name: name, widget: string }
                  - label: Level
                    name: level
                    widget: select
                    options: [beginner, intermediate, advanced, expert]

  # ─── Experience ─────────────────────────────────────────────────────────────
  - name: experience
    label: Experience
    files:
      - name: experience
        label: Work Experience
        file: src/content/experience.json
        format: json
        fields:
          - label: Experience Entries
            name: root
            widget: list
            fields:
              - { label: Job Title, name: title, widget: string }
              - { label: Company, name: company, widget: string }
              - { label: "Start Date (YYYY-MM)", name: startDate, widget: string, pattern: ['^\d{4}-\d{2}$', "Use YYYY-MM format, e.g. 2022-03"] }
              - { label: "End Date (YYYY-MM or leave blank for current)", name: endDate, widget: string, required: false }
              - { label: Description, name: description, widget: text }

  # ─── Certifications ─────────────────────────────────────────────────────────
  - name: certifications
    label: Certifications
    files:
      - name: certifications
        label: Certifications
        file: src/content/certifications.json
        format: json
        fields:
          - label: Certifications
            name: root
            widget: list
            fields:
              - { label: Certification Name, name: name, widget: string }
              - { label: Issuing Organization, name: issuer, widget: string }
              - { label: "Issue Date (YYYY-MM)", name: issueDate, widget: string }
              - { label: Verification URL (optional), name: verificationUrl, widget: string, required: false }

  # ─── Projects ───────────────────────────────────────────────────────────────
  - name: projects
    label: Projects
    files:
      - name: projects
        label: Projects
        file: src/content/projects.json
        format: json
        fields:
          - label: Projects
            name: root
            widget: list
            fields:
              - { label: Project Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Technology Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
              - { label: Thumbnail Image, name: thumbnail, widget: image }
              - { label: Live Demo URL (optional), name: demoUrl, widget: string, required: false }
              - { label: Repository URL (optional), name: repoUrl, widget: string, required: false }

  # ─── Services ───────────────────────────────────────────────────────────────
  - name: services
    label: Services
    files:
      - name: services
        label: Services
        file: src/content/services.json
        format: json
        fields:
          - label: Services
            name: root
            widget: list
            fields:
              - { label: Service Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: "Lucide Icon Name (e.g. Code2, Globe, Database)", name: icon, widget: string }

  # ─── Testimonials ───────────────────────────────────────────────────────────
  - name: testimonials
    label: Testimonials
    files:
      - name: testimonials
        label: Testimonials
        file: src/content/testimonials.json
        format: json
        fields:
          - label: Testimonials
            name: root
            widget: list
            fields:
              - { label: Author Name, name: author, widget: string }
              - { label: Role / Company, name: role, widget: string }
              - { label: Photo (optional), name: photo, widget: image, required: false }
              - { label: Testimonial Text, name: text, widget: text }

  # ─── Blog Posts ─────────────────────────────────────────────────────────────
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: "Publish Date", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: Excerpt, name: excerpt, widget: text }
      - { label: Cover Image, name: coverImage, widget: image }
      - { label: Tags, name: tags, widget: list, field: { label: Tag, name: tag, widget: string } }
      - { label: Body, name: body, widget: markdown }
